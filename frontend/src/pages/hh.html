<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;
        
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);
        
        function createPlanet(size, color, distance, speed) {
            const geometry = new THREE.BoxGeometry(size, size, size);
            const edges = new THREE.EdgesGeometry(geometry);
            const material = new THREE.LineBasicMaterial({ color: color });
            const planet = new THREE.LineSegments(edges, material);
            scene.add(planet);
            return { mesh: planet, distance: distance, angle: Math.random() * Math.PI * 2, speed: speed };
        }
        
        const planets = [
            createPlanet(1, 0x888888, 10, 0.02), // Mercury
            createPlanet(1.5, 0xffa500, 15, 0.015), // Venus
            createPlanet(2, 0x0000ff, 20, 0.01), // Earth
            createPlanet(1.8, 0xff0000, 30, 0.008) // Mars
        ];
        
        function animate() {
            requestAnimationFrame(animate);
            
            planets.forEach(planet => {
                planet.angle += planet.speed;
                planet.mesh.position.x = planet.distance * Math.cos(planet.angle);
                planet.mesh.position.z = planet.distance * Math.sin(planet.angle);
            });
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
